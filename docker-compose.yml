version: '3.8'

services:
  fastapi:
    build: .
    container_name: pv-fastapi
    restart: always
    ports:
      - "8887:8887"
    env_file:
      - ./backend/app/.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./database.db
    volumes:
      - ./backend:/app/backend
      - ./backend/app/database.db:/app/database.db