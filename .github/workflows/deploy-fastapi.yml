name: Deploy FastAPI

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_USER }}
          key: ${{ secrets.TX_KEY }}
          source: "backend/"
          target: "/root/www/web/pv"

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_USER }}
          key: ${{ secrets.TX_KEY }}
          script: |
            cd /root/www/web/pv/backend
      
            # 确保 uv 在 PATH 中
            export PATH="$HOME/.cargo/bin:$PATH"
            
            # uv 会自动创建 .venv、安装依赖、管理环境
            uv venv
            uv pip sync requirements.txt
            
            # 重启服务
            pm2 restart fastapi || pm2 start .venv/bin/uvicorn --name fastapi -- main:app --host 0.0.0.0 --port 8887
            pm2 save