name: Deploy FastAPI to Server

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_USER }}
          key: ${{ secrets.TX_KEY }}
          script: |
            cd ~/www/github/pv
            git checkout .
            git clean -fd
            git pull
            
            docker-compose down -v --rmi all
            docker-compose up -d --build