name: Deploy FastAPI

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_USER }}
          key: ${{ secrets.TX_KEY }}
          source: "backend/"
          target: "/root/www/web/pv"

      - name: Restart service
  uses: appleboy/ssh-action@v1.2.0
  with:
    host: ${{ secrets.TX_HOST }}
    username: ${{ secrets.TX_USER }}
    key: ${{ secrets.TX_KEY }}
    script: |
      cd /root/www/web/pv/backend
      
      # 使用完整路径
      /root/.local/bin/uv venv
      /root/.local/bin/uv pip sync requirements.txt
      
      /root/.nvm/versions/node/v22.22.0/bin/pm2 restart fastapi || \
      /root/.nvm/versions/node/v22.22.0/bin/pm2 start /root/.cargo/bin/uv --name fastapi -- run uvicorn main:app --host 0.0.0.0 --port 8887
      
      /root/.nvm/versions/node/v22.22.0/bin/pm2 save